<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FA7D6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3FA7D6"/>
      <stop offset="100%" stop-color="#3FA7D6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .sub   { font: 400 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cfe8f3; letter-spacing: 2px; }
      .fade  { animation: fadeIn 1.2s ease-out both; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <!-- Background with animated waving bottom edge -->
  <path fill="url(#bg)" d="M0 0 H1200 V200 C1000 240 800 170 600 200 C400 230 200 170 0 200 Z">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M0 0 H1200 V200 C1000 240 800 170 600 200 C400 230 200 170 0 200 Z;
              M0 0 H1200 V200 C1000 170 800 230 600 200 C400 170 200 230 0 200 Z;
              M0 0 H1200 V200 C1000 240 800 170 600 200 C400 230 200 170 0 200 Z"/>
  </path>

  <!-- Subtle second wave layer -->
  <path fill="#3FA7D6" opacity="0.12" d="M0 180 C200 150 400 210 600 180 C800 150 1000 210 1200 180 V210 C1000 240 800 180 600 210 C400 240 200 180 0 210 Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0 180 C200 150 400 210 600 180 C800 150 1000 210 1200 180 V210 C1000 240 800 180 600 210 C400 240 200 180 0 210 Z;
              M0 180 C200 210 400 150 600 180 C800 210 1000 150 1200 180 V210 C1000 180 800 240 600 210 C400 180 200 240 0 210 Z;
              M0 180 C200 150 400 210 600 180 C800 150 1000 210 1200 180 V210 C1000 240 800 180 600 210 C400 240 200 180 0 210 Z"/>
  </path>

  <text x="600" y="100" text-anchor="middle" class="title fade d1">Pedro Fernandes</text>
  <rect x="450" y="120" width="300" height="2" fill="url(#accent)" class="fade d2"/>
  <text x="600" y="152" text-anchor="middle" class="sub fade d3">SOFTWARE &amp; MOBILE ENGINEER</text>
</svg>
